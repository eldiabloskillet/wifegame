<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>wifegame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;800&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>wife<span>game</span></h1>
      <div class="sub"><span id="date"></span></div>
    </div>
    <div class="top-btns">
      <button id="stats-btn" class="icon-btn" aria-label="Statistics" title="Statistics">📊</button>
      <button id="share-btn" class="icon-btn" aria-label="Results" title="Results">🏆</button>
      <button id="help-btn" class="icon-btn" aria-label="How to play">?</button>
    </div>
  </header>

  <main class="wrap">
    <p class="lede">Create four groups of four. Every word is locked behind a mini-game — play it to uncover the word. <span id="progress"></span></p>
    <div id="solved"></div>
    <div id="board" class="board"></div>
    <div class="controls">
      <div id="mistakes" class="mistakes"></div>
      <div class="btn-row">
        <button id="shuffle" class="btn pill">Shuffle</button>
        <button id="deselect" class="btn pill">Deselect all</button>
        <button id="submit" class="btn pill primary">Submit</button>
      </div>
    </div>
    <section id="end" class="end" hidden></section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <div class="sheet-head">
        <button id="m-close" class="icon-btn" aria-label="Back to board">←</button>
        <div class="sheet-title">
          <h2 id="m-title"></h2>
          <p id="m-blurb"></p>
        </div>
        <button id="m-giveup" class="btn small ghost">Give up</button>
      </div>
      <div id="m-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="sheet help">
      <div class="sheet-head">
        <div class="sheet-title"><h2>How to play</h2></div>
        <button class="icon-btn help-close" aria-label="Close">×</button>
      </div>
      <div class="sheet-body">
        <p class="help-line">Connections, but each square is another game.</p>
        <button class="btn primary help-close">Let's play</button>
      </div>
    </div>
  </div>

  <div id="results" class="modal" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title"><h2>Results</h2></div>
        <button class="icon-btn rs-close" aria-label="Close">×</button>
      </div>
      <div class="sheet-body">
        <div id="rs-body"></div>
        <div class="btn-row">
          <button id="rs-share" class="btn primary">Share results</button>
        </div>
      </div>
    </div>
  </div>

  <div id="stats" class="modal" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title"><h2>Statistics</h2></div>
        <button class="icon-btn st-close" aria-label="Close">×</button>
      </div>
      <div id="st-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/wordbank.js"></script>
  <script src="js/puzzles.js"></script>
  <script src="js/games/crossword.js"></script>
  <script src="js/games/wordle.js"></script>
  <script src="js/games/wordsearch.js"></script>
  <script src="js/games/unshuffle.js"></script>
  <script src="js/games/hangman.js"></script>
  <script src="js/games/sweeper.js"></script>
  <script src="js/games/letterboxed.js"></script>
  <script src="js/games/trail.js"></script>
  <script src="js/games/snake.js"></script>
  <script src="js/games/typeshift.js"></script>
  <script src="js/games/wheel.js"></script>
  <script src="js/games/vowels.js"></script>
  <script src="js/games/stacks.js"></script>
  <script src="js/games/memory.js"></script>
  <script src="js/games/sonar.js"></script>
  <script src="js/games/rain.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
